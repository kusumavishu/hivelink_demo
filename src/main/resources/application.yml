info:
  app:
    name: ${APP_NAME}
    version: ${APP_VERSION}
    description: ${APP_DESCRIPTION}
    environment: ${APP_ENVIRONMENT}
    author: ${APP_AUTHOR}

  developer:
    name: ${APP_AUTHOR}

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: hivelink_demo

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      validation-timeout: 5000
      connection-timeout: 30000
      idle-timeout: 60000
      keepalive-time: 30000
      max-lifetime: 120000
      maximum-pool-size: 3
      minimum-idle: 1

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    user:
      name: ${ADMIN_USERNAME}
      password: ${ADMIN_PASSWORD}

server:
  port: 8080
  servlet:
    context-path: /v1
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param   # never | always | on_param
    include-exception: false

jwt:
  secret: JWT_KEY_FOR_springboot_with_supabase_ON_04_09_2026
  access-token-expiration: 18000 #  900000
  refresh-token-expiration: 604800000

supabase:
  url: ${SUPABASE_URL}
  service-key: ${SUPABASE_SECRET_KEY}

  storage:
    buckets:
      images: images
      documents: documents

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    layout: BaseLayout
    path: /api/docs
    filter: true
    tags-sorter: alpha
    disable-swagger-default-url: true
    stay-at-custom-path: true
    operations-sorter: method
    try-it-out-enabled: true
    display-request-duration: true
    persist-authorization: true
